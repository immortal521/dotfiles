palette = "noctalia"
add_newline = true
command_timeout = 1500

format = """\
[┏━](blue)\
$os\
$username\
[@](blue)\
$hostname\
$container\
$nix_shell\
$fill\
$time\
$memory_usage\
$battery\
$cmd_duration\
$status
[┣━](blue)\
$directory\
$git_branch\
$git_metrics\
$git_state\
$golang\
$nodejs\
$python\
$java\
$kotlin\
$rust\
$docker_context\
$kubernetes
[┗━►](blue) \
"""

right_format = """$jobs"""

# =========================
# Core
# =========================

[fill]
symbol = " "

[character]
success_symbol = "[#](yellow)"
error_symbol = "[✘](red)"
vimcmd_symbol = "[](green)"

[status]
disabled = false
map_symbol = true
symbol = " "
success_symbol = ""
sigint_symbol = "󰗼 "
not_found_symbol = " "
not_executable_symbol = "󰜺 "
format = "[\\[$symbol$common_meaning\\]]($style)"
style = "red"

[time]
disabled = false
time_format = "%y/%m/%d %H:%M:%S"
format = "[\\[󰥔 $time\\]]($style)"
style = "blue"

[cmd_duration]
min_time = 300
show_milliseconds = true
format = "[\\[󰔛 $duration\\]]($style)"
style = "green"

[memory_usage]
disabled = false
threshold = 70
format = "[\\[󰍛 ${ram_pct}\\]]($style)"
style = "green"

# =========================
# User / Host
# =========================

[username]
show_always = true
style_user = "blue"
style_root = "red"
format = "[$user]($style)"

[hostname]
ssh_only = false
format = "[ $hostname](blue)"

[os]
disabled = false
format = "[$symbol](maroon)"

[os.symbols]
Arch = "󰣇 "
Ubuntu = "󰕈 "
Debian = "󰣚 "
Fedora = "󰣛 "
Macos = "󰀵 "
Windows = "󰍲 "

[shell]
disabled = true
format = "[\\[$indicator\\]]($style)"
style = "overlay2"

[container]
format = "[\\[⬢ $name\\]]($style)"
style = "yellow"

[nix_shell]
format = "[\\[❄ $name\\]]($style)"
style = "sky"

# =========================
# Directory
# =========================

[directory]
truncation_length = 6
truncate_to_repo = true
fish_style_pwd_dir_length = 2
read_only = " 󰌾"
home_symbol = "~"
format = "[\\[ $path\\]]($style)[$read_only]($read_only_style)"
style = "maroon"
read_only_style = "red"

# =========================
# Git
# =========================

[git_branch]
symbol = " "
format = "[\\[$symbol$branch\\]]($style)"
style = "rosewater "

[git_status]
disabled = false
format = '([\[$all_status$ahead_behind\]]($style))'
style = "yellow"

[git_metrics]
disabled = false
format = '([\[+$added-$deleted\]]($added_style))'
added_style = "yellow"

[git_state]
format = "[\\($state( $progress_current/$progress_total)\\)]($style)"
style = "red"

# =========================
# Languages
# =========================

[golang]
symbol = " "
format = "[\\[$symbol$version\\]]($style)"
style = "blue"

[nodejs]
symbol = "󰎙 "
format = "[\\[$symbol$version\\]]($style)"
style = "green"

[python]
symbol = " "
python_binary = ["python3"]
format = "[\\[$symbol$version\\]]($style)"
style = "yellow"

[java]
symbol = " "
format = "[\\[$symbol$version\\]]($style)"
style = "red"

[kotlin]
symbol = " "
format = "[\\[$symbol$version\\]]($style)"
style = "mauve"

[rust]
symbol = "󱘗 "
format = "[\\[$symbol$version\\]]($style)"
style = "peach"

# =========================
# Infra
# =========================

[docker_context]
symbol = " "
format = "[\\[$symbol$context\\]]($style)"
style = "blue"

[kubernetes]
disabled = false
symbol = "󱃾 "
format = "[\\[$symbol$context(:$namespace)\\]]($style)"
style = "sky"

# =========================
# Battery
# =========================

[battery]
full_symbol = " "
charging_symbol = " "
discharging_symbol = " "
format = "[\\[$symbol$percentage\\]]($style)"

[[battery.display]]
threshold = 30
style = "red"

[[battery.display]]
threshold = 100
style = "green"

# =========================
# Jobs
# =========================

[jobs]
symbol = "󰣖 "
number_threshold = 1
format = "[\\[$symbol$number\\]]($style)"
style = "yellow"

