[overview]
zoom = 0.65 # 0.1-0.75
background_blur = true
# background_tint = "#10101430"
# workspace_background = "#00000044" # set alpha to Ft for an opaque background

[hot_corners.top_left]
enabled = false
delay_ms = 500
action = "overview-open"

[hot_corners.top_right]
enabled = false
delay_ms = 500
action = "overview-close"

[hot_corners.bottom_left]
enabled = false
delay_ms = 500
action = "overview-toggle"

[hot_corners.bottom_right]
enabled = false
delay_ms = 500
action = "spawn:notify-send 'Bottom right'"
