[layout]
mode = "scrolling"                      # "scrolling" or "dwindle" or "master"
gap = 4                                 # 0-500
extent_presets = [0.333, 0.5, 0.667, 1]

[layout.struts]
left = 0
right = 0
top = 0
bottom = 0

[layout.scrolling]
# default_extent_fraction = 0.5 # remove to let clients choose
center_underfull_strip = true # center the strip whenever it is narrower than the viewport
